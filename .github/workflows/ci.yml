name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Gate: the test suite must pass. Anki is mocked by tests/conftest.py, so no
  # heavy aqt/PyQt6 install is needed — just pytest.
  test:
    name: Tests (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pytest-mock
      - name: Run test suite
        run: python tests/run_tests.py

  # Advisory: surfaces lint/format/type issues without blocking the build yet.
  # The codebase is not fully ruff/black-clean; once a formatting pass lands,
  # drop the `continue-on-error` lines to make these hard gates.
  lint:
    name: Lint & types (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install linters
        run: python -m pip install --upgrade pip ruff black mypy
      - name: ruff — undefined names (BLOCKING)
        # F821 catches real bugs (a used name that is not imported/defined), e.g. a
        # function moved to a new module without its import. This gate is non-advisory.
        run: ruff check --select F821 src/ tests/
      - name: ruff (advisory)
        run: ruff check src/ tests/
        continue-on-error: true
      - name: black --check
        run: black --check src/ tests/
        continue-on-error: true
      - name: mypy
        run: mypy src/
        continue-on-error: true
