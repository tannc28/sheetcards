name: Release

# Releasing is driven by the version, not by remembering to push a tag. Merge to
# main with manifest.json bumped and this tags, builds and publishes. Merge without
# bumping — a docs fix, a refactor — and it finds the tag already exists and stops,
# so an ordinary merge costs one short job and nothing else.
on:
  push:
    branches: [main]
  # Lets a failed release be re-run without touching main.
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: false

permissions:
  contents: write # required to push the tag and create the release

jobs:
  release:
    name: Tag and publish .ankiaddon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to tell a new version from a released one

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The version lives in two files that must agree; shipping a package whose
      # manifest disagrees with its tag is only noticed after users install it.
      - name: Resolve version
        id: version
        run: |
          MANIFEST_VERSION=$(python -c "import json;print(json.load(open('manifest.json'))['version'])")
          PYPROJECT_VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "manifest=$MANIFEST_VERSION pyproject=$PYPROJECT_VERSION"

          if [ "$MANIFEST_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Version mismatch — manifest.json '$MANIFEST_VERSION' and pyproject.toml '$PYPROJECT_VERSION' must match."
            exit 1
          fi

          echo "version=$MANIFEST_VERSION" >> "$GITHUB_OUTPUT"

          # An unchanged version means this merge was not a release.
          if git rev-parse -q --verify "refs/tags/v$MANIFEST_VERSION" >/dev/null; then
            echo "::notice::v$MANIFEST_VERSION is already released — nothing to do. Bump manifest.json and pyproject.toml to cut a release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # The changelog is where a release is described, so the release body is that
      # text. Checking it here fails the run *before* anything is tagged or built,
      # rather than leaving a tag pointing at a release that says nothing.
      - name: Check the changelog documents this version
        if: steps.version.outputs.release == 'true'
        run: python scripts/changelog_section.py "${{ steps.version.outputs.version }}" > /dev/null

      # Anki is mocked by tests/conftest.py, so the suite needs nothing heavier than
      # pytest. A version that cannot pass its own tests must not ship.
      - name: Run test suite
        if: steps.version.outputs.release == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python tests/run_tests.py

      # Both scripts are stdlib-only and non-interactive. They copy the tree into
      # build/ and flip IS_DEVELOPMENT_MODE to False in the copy, leaving the
      # checkout untouched.
      - name: Build packages
        if: steps.version.outputs.release == 'true'
        run: |
          python scripts/create_standalone_package.py
          python scripts/create_ankiweb_package.py

      # Enforces the AnkiWeb requirements: files at the ZIP root, a valid manifest,
      # and no __pycache__/.pyc.
      - name: Validate packages
        if: steps.version.outputs.release == 'true'
        run: |
          python scripts/validate_packages.py build/sheetcards-standalone.ankiaddon
          python scripts/validate_packages.py build/sheetcards.ankiaddon

      - name: Name assets after the version
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mv build/sheetcards-standalone.ankiaddon "build/sheetcards-${VERSION}.ankiaddon"
          mv build/sheetcards.ankiaddon "build/sheetcards-${VERSION}-ankiweb.ankiaddon"

      # Tag only once everything above has passed, so a failed build never leaves a
      # tag behind that the next run would mistake for an already-published release.
      - name: Tag the release
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Publish release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DRAFT: ${{ github.event.inputs.draft }}
        run: |
          CHANGES=$(python scripts/changelog_section.py "$VERSION")

          NOTES=$(cat <<EOF
          $CHANGES

          ---

          ### Install

          Download \`sheetcards-${VERSION}.ankiaddon\` below, then in Anki:
          **Tools → Add-ons → Install from file…** and restart.

          | Asset | Use |
          |---|---|
          | \`sheetcards-${VERSION}.ankiaddon\` | Manual install (full manifest) |
          | \`sheetcards-${VERSION}-ankiweb.ankiaddon\` | Upload to AnkiWeb (stripped manifest) |
          EOF
          )

          # Only the manual dispatch can ask for a draft.
          DRAFT_FLAG=""
          if [ "$DRAFT" = "true" ]; then DRAFT_FLAG="--draft"; fi

          # A re-run refreshes the body as well as the assets.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release edit "v$VERSION" --notes "$NOTES"
            gh release upload "v$VERSION" build/*.ankiaddon --clobber
          else
            gh release create "v$VERSION" build/*.ankiaddon \
              --title "v$VERSION" \
              --notes "$NOTES" \
              $DRAFT_FLAG
          fi
