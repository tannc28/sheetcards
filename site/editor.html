<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Sheets2Anki — build a settings row</title>
<meta name="description" content="Write one column's settings row and watch the card change, using the add-on's own code. Copy the cell when it looks right.">
<script>
  try {
    var t = localStorage.getItem("s2a-theme");
    if (t === "dark") document.documentElement.dataset.theme = "dark";
  } catch (e) {}
</script>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="masthead">
  <div class="brand">
    <h1 translate="no">Sheets2Anki <span class="brand-tag" data-i18n="guideTag">editor</span></h1>
  </div>

  <button id="theme" class="themebtn" type="button"></button>
  <nav id="langs" class="langs" aria-label="Language"></nav>
  <a class="ghost" href="./" data-i18n="backToPreview">Preview a sheet</a>
</header>

<!-- One column, not a whole settings row. A column is the unit people actually
     get stuck on, and one column fits on a phone. -->
<main id="app" class="app editor">

  <section class="panel">
    <h2 class="panel-head"><span class="panel-toggle" aria-disabled="true">
      <span class="step" aria-hidden="true">1</span>
      <span class="panel-name" data-i18n="edPanelSheet">Sheet</span>
    </span></h2>

    <div class="panel-body ed-form">
      <!-- Above the sheet, not beside the card: a warning is about what was just
           typed into row 2, and it is the sheet that has to change to clear it. -->
      <div id="warn" class="warnbar" hidden>
        <ul id="warnlist" class="warnings"></ul>
      </div>

      <!-- Shaped like the thing it writes into: a sheet. Row 1 the column
           names, row 2 the settings row, row 3 one card's worth of data. The
           grid scrolls inside itself so the page never scrolls sideways. -->
      <!-- What you do *to the table* sits on the table, in the corner a
           spreadsheet's own controls live in. Adding a column is the "+" at the
           end of the header strip, and removing one is the "×" on the column
           itself — both where the thing they act on is. -->
      <p class="sheettools">
        <span class="hint" data-i18n="edPasteHint">Drag to select cells, then copy — or paste rows from a spreadsheet</span>
        <button id="add" class="tool" type="button"
                data-i18n-attr="title:edAddColumn,aria-label:edAddColumn">+</button>
        <button id="copy" class="tool" type="button"
                data-i18n-attr="title:edCopy,aria-label:edCopy">⧉</button>
        <button id="export" class="tool" type="button"
                data-i18n-attr="title:edExport,aria-label:edExport">↓</button>
      </p>

      <div class="sheetwrap">
        <div class="sheet" id="sheet" role="group"
             data-i18n-attr="aria-label:edSheet"></div>
      </div>

      <p class="entry-alt">
        <span id="status" class="status" role="status" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span><span id="status-text"></span>
        </span>
      </p>

      <!-- Tapped, not dragged: a drag is the one gesture that does not survive a
           phone, and most people are on one. -->
      <div class="stack">
        <h3><span data-i18n="edAdd">Add a directive</span>
          <span class="count" id="keyfor"></span></h3>
        <div id="keys" class="collist"></div>
        <!-- The values on offer for whichever directive is open. Inline, because
             a popover on a phone covers the row you were choosing from. -->
        <div id="opts" hidden></div>
      </div>
    </div>
  </section>

  <!-- The two things a settings row decides, in the two panels the preview page
       gives them and in the same order: where the note is filed, then what the
       card looks like. A subdeck column only ever reaches the first of the two,
       so with the card alone on screen it looked like it did nothing at all. -->
  <section class="panel">
    <h2 class="panel-head"><span class="panel-toggle" aria-disabled="true">
      <span class="step" aria-hidden="true">2</span>
      <span class="panel-name" data-i18n="panelDeck">Deck</span>
    </span></h2>

    <div class="panel-body ed-deck">
      <div id="deck"></div>
    </div>
  </section>

  <section class="panel">
    <h2 class="panel-head"><span class="panel-toggle" aria-disabled="true">
      <span class="step" aria-hidden="true">3</span>
      <span class="panel-name" data-i18n="panelCard">Card</span>
    </span></h2>

    <div class="panel-body">
      <nav class="tabs" id="tabs"></nav>
      <div id="view"></div>
    </div>
  </section>

</main>

<script type="module" src="./editor.js"></script>
</body>
</html>
