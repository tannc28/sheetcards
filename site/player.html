<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  p {
    margin: 0; padding: 14px; color: #cbd2dc; background: #14171c;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  code { color: #f0a; word-break: break-all; }
</style>
</head>
<body>
<script>
/**
 * A frame that lends its origin to a video.
 *
 * Anki's mobile clients load a card from a `file://` origin, so their webview
 * sends no HTTP Referer — and YouTube refuses to play an embed that arrives
 * without one, answering "Error 153: Video player configuration error". No
 * referrerpolicy can help, because there is no origin to send *from*.
 *
 * A card therefore frames this page instead, and this page frames the video.
 * This page is served over https, so the request that finally reaches YouTube
 * carries a real referrer and plays. The card keeps the plain address in its
 * field; only the template knows about this page, which means turning it off
 * later is one re-sync rather than an edit to every note.
 *
 * Only known video hosts are framed. Without that check this would frame any
 * address anyone put in a query string, under this domain — an open redirect
 * wearing a video's clothes.
 */
const ALLOWED = [
  /^https:\/\/www\.youtube\.com\/embed\/[\w-]+/,
  /^https:\/\/www\.youtube-nocookie\.com\/embed\/[\w-]+/,
  /^https:\/\/player\.vimeo\.com\/video\/\d+/,
  /^https:\/\/drive\.google\.com\/file\/d\/[\w-]+\/preview/,
];

// Taken raw rather than through URLSearchParams: the card template can only
// paste the field in, so the value arrives unencoded and its own `?t=` or
// `&start=` would otherwise be read as parameters of *this* page.
const raw = location.search.startsWith("?src=")
  ? decodeURIComponent(location.search.slice(5))
  : "";

if (ALLOWED.some((pattern) => pattern.test(raw))) {
  const frame = document.createElement("iframe");
  frame.src = raw;
  frame.allow = "encrypted-media; picture-in-picture; fullscreen";
  frame.allowFullscreen = true;
  frame.referrerPolicy = "strict-origin-when-cross-origin";
  document.body.appendChild(frame);
} else {
  const message = document.createElement("p");
  message.textContent = raw
    ? "This page only plays YouTube, Vimeo and Google Drive videos. It was asked for: "
    : "No video address was given.";
  if (raw) {
    const shown = document.createElement("code");
    shown.textContent = raw;
    message.appendChild(shown);
  }
  document.body.appendChild(message);
}
</script>
</body>
</html>
