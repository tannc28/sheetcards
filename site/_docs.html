<!doctype html>
<html lang="%%LANG%%">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<!-- The template every documentation page is built from: scripts/build_site.py
     fills in the %%…%% slots from docs/site/*.md (Vietnamese, /docs/) and
     docs/site/en/*.md (English, /docs/en/). Not published itself — a name
     starting with "_" is a build input. %%ROOT%% is the way back to the site's
     root from the page's folder. -->
<title>%%TITLE%% — SheetCards docs</title>
<meta name="description" content="%%DESCRIPTION%%">
<link rel="alternate" hreflang="%%TWIN_LANG%%" href="%%TWIN%%">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='8' width='19' height='21' rx='4' fill='%234c32c0' opacity='.4'/%3E%3Crect x='10' y='3' width='19' height='21' rx='4' fill='%234c32c0'/%3E%3Cpath d='M14.5 10h10M14.5 14.5h10M14.5 19h6' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
  try {
    var t = localStorage.getItem("sc-theme");
    if (t === "dark") {
      document.documentElement.dataset.theme = "dark";
      document.querySelector('meta[name="theme-color"]').content = "#18151f";
    }
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="%%ROOT%%style.css">
</head>
<body class="page docs" data-lang="%%LANG%%">

<a class="skip" href="#main" data-i18n="skipMain">Tới nội dung chính</a>

<header class="masthead">
  <div class="brand">
    <a class="name" href="%%ROOT%%" translate="no">SheetCards</a> <span class="brand-tag" data-i18n="docsTag">docs</span>
  </div>
  <nav class="sitenav" aria-label="Các trang" data-i18n-attr="aria-label:navLabel">
    <a href="%%ROOT%%" data-i18n="navHome">Trang chủ</a>
    <a href="%%ROOT%%create/" data-i18n="navPreview">Tạo flashcard</a>
    <a href="%%ROOT%%sheet/" data-i18n="navSheet">Tạo Sheet</a>
    <a href="./" aria-current="page" data-i18n="navDocs">Docs</a>
  </nav>
  <a class="ghlink" href="https://github.com/tannc28/sheetcards" rel="noopener" aria-label="GitHub" title="GitHub" data-icon="github"></a>
  <a class="ghlink fbicon" href="%%ROOT%%contact/?from=%%FROM%%" aria-label="Liên hệ & góp ý" title="Liên hệ & góp ý" data-i18n-attr="aria-label:contactIcon,title:contactIcon" data-icon="message-square"></a>
  <button id="theme" class="themebtn" type="button"></button>
  <nav id="langs" class="langs" aria-label="Ngôn ngữ" data-i18n-attr="aria-label:langLabel"></nav>
</header>

<div class="docs-layout">
  <!-- One list of pages, open beside the text on a wide screen and folded into a
       "Contents" disclosure above it on a phone, where a sidebar has no room. -->
  <nav class="docnav" aria-label="%%W_NAV%%">
    <details id="docnav">
      <summary>%%W_CONTENTS%%</summary>
      %%NAV%%
    </details>
  </nav>

  <main id="main" class="prose" lang="%%LANG%%" tabindex="-1">
    <p class="doc-twin" lang="%%TWIN_LANG%%"><span data-icon="languages"></span><a
       href="%%TWIN%%" hreflang="%%TWIN_LANG%%">%%TWIN_TEXT%%</a></p>
%%BODY%%
    <nav class="pager" aria-label="%%W_PAGES%%">
%%PAGER%%
    </nav>
    <p class="editlink"><a href="https://github.com/tannc28/sheetcards/blob/main/%%SOURCE%%" rel="noopener">%%W_EDIT%%</a></p>
    <p class="contactlink"><a href="%%ROOT%%contact/?from=%%FROM%%"><span data-icon="message-square"></span><span>%%W_CONTACT%%</span></a></p>
  </main>
  %%ONPAGE%%
</div>

<script type="module" src="%%ROOT%%page.js"></script>
</body>
</html>
