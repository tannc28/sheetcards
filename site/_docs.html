<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<!-- The template every documentation page is built from: scripts/build_site.py
     fills in the %%…%% slots from docs/site/*.md. Not published itself — a name
     starting with "_" is a build input. -->
<title>%%TITLE%% — SheetCards docs</title>
<meta name="description" content="%%DESCRIPTION%%">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='8' width='19' height='21' rx='4' fill='%232f55c4' opacity='.4'/%3E%3Crect x='10' y='3' width='19' height='21' rx='4' fill='%232f55c4'/%3E%3Cpath d='M14.5 10h10M14.5 14.5h10M14.5 19h6' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
  try {
    var t = localStorage.getItem("sc-theme");
    if (t === "dark") {
      document.documentElement.dataset.theme = "dark";
      document.querySelector('meta[name="theme-color"]').content = "#171c24";
    }
  } catch (e) {}
</script>
<link rel="stylesheet" href="../style.css">
</head>
<body class="page docs">

<a class="skip" href="#main" data-i18n="skipMain">Tới nội dung chính</a>

<header class="masthead">
  <div class="brand">
    <p class="name" translate="no">SheetCards <span class="brand-tag" data-i18n="docsTag">docs</span></p>
  </div>
  <nav class="sitenav" aria-label="Các trang" data-i18n-attr="aria-label:navLabel">
    <a href="../" data-i18n="navHome">Home</a>
    <a href="../preview.html" data-i18n="navPreview">Preview</a>
    <a href="../editor.html" data-i18n="navEditor">Editor</a>
    <a href="./" aria-current="page" data-i18n="navDocs">Docs</a>
    <a href="https://github.com/tannc28/sheetcards" rel="noopener" translate="no">GitHub</a>
  </nav>
  <button id="theme" class="themebtn" type="button"></button>
  <nav id="langs" class="langs" aria-label="Ngôn ngữ" data-i18n-attr="aria-label:langLabel"></nav>
</header>

<div class="docs-layout">
  <!-- One list of pages, open beside the text on a wide screen and folded into a
       "Contents" disclosure above it on a phone, where a sidebar has no room. -->
  <nav class="docnav" aria-label="Documentation">
    <details id="docnav">
      <summary>Contents</summary>
      %%NAV%%
    </details>
  </nav>

  <main id="main" class="prose" lang="%%LANG%%" tabindex="-1">
%%BODY%%
    <nav class="pager" aria-label="More pages">
%%PAGER%%
    </nav>
    <p class="editlink"><a href="https://github.com/tannc28/sheetcards/blob/main/%%SOURCE%%" rel="noopener">Edit this page on GitHub</a></p>
  </main>
</div>

<script type="module" src="../page.js"></script>
</body>
</html>
