<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheets2Anki — preview a sheet before you sync it</title>
<meta name="description" content="Paste a Google Sheets link and see the decks, rows and cards the Sheets2Anki add-on would produce — running the add-on's own code in your browser.">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="bar">
  <div class="brand">
    <strong>Sheets2Anki</strong>
    <span data-i18n="brandTag">preview</span>
  </div>

  <div class="controls">
    <input id="url" type="url" spellcheck="false" autocomplete="off"
           data-i18n-attr="placeholder:urlPlaceholder,aria-label:urlLabel">
    <button id="go" data-i18n="go" disabled>Preview</button>

    <span class="or" data-i18n="or">or</span>
    <input id="file" type="file" accept=".xlsx,.xlsm,.csv,.tsv,.txt" hidden
           data-i18n-attr="aria-label:pickLabel">
    <button id="pick" class="secondary" disabled
            data-i18n="pick" data-i18n-attr="title:pickLabel">Upload a file</button>
    <select id="tabpick" hidden data-i18n-attr="aria-label:tabLabel"></select>

    <input id="deck" type="text" spellcheck="false" autocomplete="off"
           data-i18n-attr="placeholder:deckPlaceholder,aria-label:deckLabel">
  </div>

  <p id="status" class="status" role="status" aria-live="polite">
    <span class="spinner" aria-hidden="true"></span><span id="status-text"></span>
  </p>

  <nav id="langs" class="langs" aria-label="Language"></nav>
  <a class="ghost" href="https://github.com/tannc28/sheets2anki">GitHub</a>
</header>

<p id="demo-note" class="demo-note" data-i18n="demoNote" hidden></p>

<div id="stats" class="strip" hidden></div>

<main id="app" class="app" hidden>

  <aside class="pane side">
    <h2 data-i18n="decks">Decks</h2>
    <div id="tree"></div>

    <h2 class="spaced"><span data-i18n="rows">Rows</span> <span id="rowcount" class="count"></span></h2>
    <p id="rows-legend" class="muted small"></p>
    <div id="rowlist"></div>

    <div class="side-foot">
      <button id="apkg" class="apkg-btn" type="button" data-i18n="downloadApkg"></button>
      <p class="muted small" data-i18n="apkgNote"></p>
      <button id="details-btn" class="detail-toggle" type="button" aria-expanded="false"
              aria-controls="detail">
        <span class="chev" aria-hidden="true">▸</span>
        <span class="label" data-i18n="sheetDetail">Sheet detail</span>
        <span id="warncount" class="badge" hidden></span>
      </button>
    </div>
    <div id="detail" class="drawer" hidden></div>
  </aside>

  <section class="pane main">
    <nav class="tabs" id="tabs"></nav>
    <div id="view"></div>
  </section>

</main>

<!-- Covers the whole window while a file is over it, so a drop lands here rather
     than inside the card's iframe — which would navigate the frame to the file. -->
<div id="drop" class="dropzone" hidden aria-hidden="true">
  <div>
    <strong data-i18n="dropHere">Drop the file to preview it</strong>
    <span data-i18n="dropTypes"></span>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
