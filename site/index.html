<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Sheets2Anki — preview a sheet before you sync it</title>
<meta name="description" content="Paste a Google Sheets link and see the decks, rows and cards the Sheets2Anki add-on would produce — running the add-on's own code in your browser.">
<script>
  // Read before the first paint: applied from the stylesheet instead, the page
  // would flash light on its way to the dark somebody chose.
  try {
    var t = localStorage.getItem("s2a-theme");
    if (t === "dark") document.documentElement.dataset.theme = "dark";
  } catch (e) {}
</script>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<a class="skip" href="#p-card" data-i18n="skip">Skip to the card</a>

<header class="masthead">
  <div class="brand">
    <h1 translate="no">Sheets2Anki <span class="brand-tag" data-i18n="brandTag">preview</span></h1>
  </div>

  <button id="theme" class="themebtn" type="button"></button>
  <nav id="langs" class="langs" aria-label="Language"></nav>
  <a class="ghost" href="./editor.html" data-i18n="toGuide">Editor</a>
  <a class="ghost" href="https://github.com/tannc28/sheets2anki" rel="noopener">GitHub</a>
</header>

<p id="demo-note" class="demo-note" data-i18n="demoNote" hidden></p>

<section id="warnbar" class="warnbar" hidden aria-labelledby="warnbar-title">
  <h2 id="warnbar-title"><span class="warn-icon" aria-hidden="true">!</span>
    <span data-i18n="warnings">Warnings</span>
    <span id="warncount" class="count"></span></h2>
  <ul id="warnlist" class="warnings"></ul>
  <p class="muted small" data-i18n="warningsFrom"></p>
</section>

<!-- Three columns, one job each: where the sheet comes from, what deck it makes,
     what one card looks like. Side by side on a wide screen, because all three
     are things you look at while changing one of the others. On a phone there is
     no side by side, so they stack and each folds to its own header instead. -->

<main id="app" class="app">

  <section class="panel" id="p-source">
    <h2 class="panel-head">
      <button class="panel-toggle" id="src-toggle" aria-expanded="true" aria-controls="src-body">
        <span class="chev" aria-hidden="true"></span>
        <span class="step" aria-hidden="true">1</span>
        <span class="panel-name" data-i18n="panelSource">Source</span>
        <span class="panel-note" id="source"></span>
      </button>
      <!-- Outside the toggle, not inside the panel: a workbook's sheets are what
           you move between while reading panels 2 and 3, and panel 1 folds itself
           the moment a sheet loads. Left in the body, the picker was gone exactly
           when it was wanted. It is a sibling of the toggle rather than a child
           because a <select> cannot live inside a <button>. -->
      <p class="field tabpick" id="tabfield" hidden>
        <select id="tabpick" data-i18n-attr="aria-label:tabLabel"></select>
      </p>
      <!-- Beside the picker for the same reason: the sheet is edited in another
           tab and read here, so fetching it again is something you do over and
           over, and on a phone panel 1 is folded by then. -->
      <button class="panel-act" id="reload" type="button" hidden
              data-i18n-attr="title:reloadLabel,aria-label:reloadLabel">
        <span aria-hidden="true">↻</span>
      </button>
    </h2>

    <div class="panel-body" id="src-body">
      <form id="entry-form" class="stack">
        <p class="field">
          <label for="url" data-i18n="urlLabel">Sheet link</label>
          <input id="url" name="url" type="url" spellcheck="false" autocomplete="off"
                 enterkeyhint="go" data-i18n-attr="placeholder:urlPlaceholder">
        </p>
        <p class="field submit">
          <button id="go" class="btn" type="submit" data-i18n="go" disabled>Preview</button>
        </p>
      </form>

      <div class="stack">
        <p class="entry-alt">
          <span class="pickline">
            <input id="file" type="file" accept=".xlsx,.xlsm,.csv,.tsv,.txt" hidden
                   data-i18n-attr="aria-label:pickLabel">
            <button id="pick" class="linky" type="button" disabled
                    data-i18n="pick" data-i18n-attr="title:pickLabel">Upload a file</button>
            <span data-i18n="orDrop">or drop one anywhere on this page.</span>
          </span>
          <span id="status" class="status" role="status" aria-live="polite">
            <span class="spinner" aria-hidden="true"></span><span id="status-text"></span>
          </span>
        </p>
      </div>

      <!-- The sheet itself, read-only, scrolling both ways inside its own box.
           Below the link because it answers a later question: the form asks
           which sheet, this says whether the one that arrived is the one you
           meant. It is a grid because a spreadsheet is a grid — the block under
           it is still where a single row is read. -->
      <div class="stack" id="gridbox" hidden>
        <h3><span data-i18n="gridHead">The sheet</span><span class="count" id="gridcount"></span></h3>
        <div class="gridwrap" id="grid" tabindex="0" role="region"
             data-i18n-attr="aria-label:gridHead"></div>
        <p class="muted small" id="gridcut" hidden></p>
      </div>

      <!-- The chosen row, cell by cell — which is also the sheet's column list,
           because it is the same names. Not a grid: a spreadsheet on a phone is
           a sideways scroll inside a downwards one, and most people are on a
           phone. One column of name/value reads the same at every width, and
           tapping a line opens what that column became, in place. -->
      <div class="stack" id="cells" hidden>
        <h3><span id="cellhead"></span><span class="count" id="colcount"></span>
          <span class="rownav">
            <button type="button" data-step="-1" class="stepper"></button>
            <button type="button" data-step="1" class="stepper"></button>
          </span></h3>
        <div id="celllist" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <section class="panel" id="p-deck" hidden>
    <h2 class="panel-head">
      <button class="panel-toggle" id="deck-toggle" aria-expanded="true" aria-controls="deck-body">
        <span class="chev" aria-hidden="true"></span>
        <span class="step" aria-hidden="true">2</span>
        <span class="panel-name" data-i18n="panelDeck">Deck</span>
        <span class="panel-note" id="deck-note"></span>
      </button>
    </h2>

    <div class="panel-body" id="deck-body">
      <p id="summary" class="summary"></p>

      <div class="side">
        <h3 data-i18n="decks">Decks</h3>
        <div id="tree"></div>

        <h3 class="spaced"><span data-i18n="rows">Rows</span> <span id="rowcount" class="count"></span></h3>
        <p id="rows-legend" class="muted small"></p>
        <div id="rowlist"></div>

        <div class="side-foot">
          <button id="apkg" class="btn apkg-btn" type="button"
                  data-i18n="downloadApkg" data-i18n-attr="title:apkgTitle"></button>
        </div>
      </div>
    </div>
  </section>

  <section class="panel" id="p-card" hidden>
    <h2 class="panel-head">
      <button class="panel-toggle" id="card-toggle" aria-expanded="true" aria-controls="card-body">
        <span class="chev" aria-hidden="true"></span>
        <span class="step" aria-hidden="true">3</span>
        <span class="panel-name" data-i18n="panelCard">Card</span>
        <span class="panel-note" id="card-note"></span>
      </button>
    </h2>

    <div class="panel-body" id="card-body">
      <nav class="tabs" id="tabs"></nav>
      <div id="view"></div>
    </div>
  </section>

</main>

<!-- Covers the whole window while a file is over it, so a drop lands here rather
     than inside the card's iframe — which would navigate the frame to the file. -->
<div id="drop" class="dropzone" hidden>
  <div>
    <strong data-i18n="dropHere">Drop the file to preview it</strong>
    <span data-i18n="dropTypes"></span>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
