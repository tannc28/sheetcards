<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheets2Anki — preview a sheet before you sync it</title>
<meta name="description" content="Paste a Google Sheets link and see the decks, rows and cards the Sheets2Anki add-on would produce — running the add-on's own code in your browser.">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="bar">
  <div class="brand">
    <strong>Sheets2Anki</strong>
    <span>preview</span>
  </div>

  <div class="controls">
    <input id="url" type="url" spellcheck="false" autocomplete="off"
           aria-label="Google Sheets link"
           placeholder="https://docs.google.com/spreadsheets/d/…/edit">
    <input id="deck" type="text" spellcheck="false" autocomplete="off"
           aria-label="Deck name" placeholder="deck name">
    <button id="go" disabled>Preview</button>
  </div>

  <p id="status" class="status" role="status" aria-live="polite">
    <span class="spinner" aria-hidden="true"></span><span id="status-text">Loading…</span>
  </p>

  <a class="ghost" href="https://github.com/tannc28/sheets2anki">GitHub</a>
</header>

<p id="demo-note" class="demo-note" hidden>Showing an example sheet — an HSK 4 deck
  with a settings row, so you can see what the directives do. Paste your own link
  above to read yours instead.</p>

<div id="stats" class="strip" hidden></div>

<main id="app" class="app" hidden>

  <aside class="pane side">
    <h2>Decks</h2>
    <div id="tree"></div>

    <h2 class="spaced">Rows <span id="rowcount" class="count"></span></h2>
    <div id="rowlist"></div>

    <div class="side-foot">
      <button id="details-btn" class="detail-toggle" type="button" aria-expanded="false"
              aria-controls="detail">
        <span class="chev" aria-hidden="true">▸</span>
        <span class="label">Sheet detail</span>
        <span id="warncount" class="badge" hidden></span>
      </button>
    </div>
    <div id="detail" class="drawer" hidden></div>
  </aside>

  <section class="pane main">
    <nav class="tabs" id="tabs"></nav>
    <div id="view"></div>
  </section>

</main>

<script type="module" src="./app.js"></script>
</body>
</html>
